name: Build and publish website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.9.4
        with:
          pixi-version: v0.72.1
          cache: true

      - name: Quarto check
        run: pixi r quarto check

      - name: Render website
        timeout-minutes: 10
        run: pixi r render-debug

      - name: Render combined notes PDF
        timeout-minutes: 10
        run: pixi r render-book

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: course_notes/_site

      - name: Upload render diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quarto-render-diagnostics
          if-no-files-found: warn
          path: |
            quarto-render-debug.log
            ~/.local/share/quarto/logs/
            course_notes/**/*.quarto_ipynb*

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
